<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- スクールレーダーのアイコン原本：クリーム色の背景＋紺のレーダー＋中心に校舎 -->
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B59A8" stop-opacity="0"/>
      <stop offset="1" stop-color="#2B59A8" stop-opacity=".28"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#FFF6E6"/>
  <!-- レーダーの輪 -->
  <g fill="none" stroke="#2B59A8" stroke-width="10" opacity=".85">
    <circle cx="256" cy="268" r="196" stroke-opacity=".35"/>
    <circle cx="256" cy="268" r="136" stroke-opacity=".6"/>
  </g>
  <!-- レーダーの走査（扇形） -->
  <path d="M256 268 L256 72 A196 196 0 0 1 438.6 197 Z" fill="url(#sweep)"/>
  <!-- 見つかった学校の点（小・中・高・大の色） -->
  <circle cx="392" cy="154" r="20" fill="#F08C00" stroke="#fff" stroke-width="7"/>
  <circle cx="104" cy="214" r="17" fill="#2F9E44" stroke="#fff" stroke-width="7"/>
  <circle cx="400" cy="372" r="17" fill="#1971C2" stroke="#fff" stroke-width="7"/>
  <circle cx="138" cy="398" r="15" fill="#9C36B5" stroke="#fff" stroke-width="6"/>
  <!-- 中心の校舎 -->
  <g>
    <!-- 旗 -->
    <path d="M256 132 V96" stroke="#1F3A68" stroke-width="8" stroke-linecap="round"/>
    <path d="M260 96 h34 l-9 11 9 11 h-34 z" fill="#E8590C"/>
    <!-- 屋根 -->
    <path d="M170 196 L256 136 L342 196 Z" fill="#1F3A68" stroke="#1F3A68" stroke-width="10" stroke-linejoin="round"/>
    <!-- 本体 -->
    <rect x="182" y="194" width="148" height="136" rx="8" fill="#1F3A68"/>
    <!-- 時計 -->
    <circle cx="256" cy="226" r="20" fill="#FFF6E6"/>
    <path d="M256 214 V227 L265 233" stroke="#1F3A68" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- 窓 -->
    <rect x="198" y="258" width="30" height="26" rx="4" fill="#FFD27A"/>
    <rect x="284" y="258" width="30" height="26" rx="4" fill="#FFD27A"/>
    <!-- 入口 -->
    <path d="M236 330 V284 a20 20 0 0 1 40 0 V330 Z" fill="#FFF6E6"/>
    <!-- 地面 -->
    <rect x="160" y="326" width="192" height="12" rx="6" fill="#1F3A68"/>
  </g>
</svg>
